name: Verified Dispatch Sampler

on:
  push:
  pull_request:

jobs:
  sample-flat-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure focused build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build verified dispatch path
        run: cmake --build build --target axm-render-external contract_flat_renderer --parallel

      - name: Sample one verified renderer/request repeatedly
        run: |
          python3 tools/verified_dispatch_sample.py \
            --harness build/axm-render-external \
            --renderer build/contract_flat_renderer \
            --request examples/contract-flat-reference.axmrender \
            --work-dir build/verified-dispatch-samples \
            --samples 5 | tee build/verified-dispatch-samples.txt

      - name: Check bounded sampler evidence
        run: |
          grep -Fx 'AXM_VERIFIED_DISPATCH_SAMPLES 1' build/verified-dispatch-samples.txt
          grep -Fx 'sample_count=5' build/verified-dispatch-samples.txt
          grep -Fx 'timing_clock=steady' build/verified-dispatch-samples.txt
          grep -Fx 'renderer_process_continuity=PASS' build/verified-dispatch-samples.txt
          grep -Fx 'verified_dispatch_sample_continuity=PASS' build/verified-dispatch-samples.txt
          grep -Fx 'verified_dispatch_sampling=PASS' build/verified-dispatch-samples.txt
          grep -E '^capability_process_elapsed_us_samples=[0-9]+(,[0-9]+){4}$' build/verified-dispatch-samples.txt
          grep -E '^render_process_elapsed_us_samples=[0-9]+(,[0-9]+){4}$' build/verified-dispatch-samples.txt
          grep -E '^receipt_verification_elapsed_us_samples=[0-9]+(,[0-9]+){4}$' build/verified-dispatch-samples.txt
          grep -E '^external_dispatch_elapsed_us_samples=[0-9]+(,[0-9]+){4}$' build/verified-dispatch-samples.txt
