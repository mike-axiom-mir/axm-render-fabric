name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ImageMagick external renderer is available
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          convert -version
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Record renderer capability manifests and negotiation
        run: |
          ./build/axm-render --capabilities build/native-evidence.axmcaps
          ./build/contract_flat_renderer --capabilities build/flat-evidence.axmcaps
          cat build/native-evidence.axmcaps
          cat build/flat-evidence.axmcaps
          ./build/axm-render-negotiate build/reference.axmrender build/native-evidence.axmcaps
          ./build/axm-render-negotiate build/contract-flat-reference.axmrender build/flat-evidence.axmcaps

          ./build/axm-render-negotiate \
            build/reference.axmrender \
            build/flat-evidence.axmcaps \
            build/native-evidence.axmcaps \
            | tee build/multi-capability-negotiation.txt
          grep -q '^manifest_count=2$' build/multi-capability-negotiation.txt
          grep -q '^compatible_count=1$' build/multi-capability-negotiation.txt
          test "$(grep -c '^compatible=YES$' build/multi-capability-negotiation.txt)" -eq 1
          test "$(grep -c '^compatible=NO$' build/multi-capability-negotiation.txt)" -eq 1
      - name: Bind chosen capability manifest to actual dispatch
        run: |
          ./build/axm-render-external \
            --renderer ./build/contract_flat_renderer \
            --request build/contract-flat-reference.axmrender \
            --receipt build/bound-flat.axmreceipt \
            --capabilities build/bound-flat-fresh.axmcaps \
            --expect-capabilities build/flat-evidence.axmcaps \
            | tee build/bound-flat-dispatch.txt
          grep -q '^expected_capabilities_match=PASS$' build/bound-flat-dispatch.txt
          grep -q '^external_process_dispatch=PASS$' build/bound-flat-dispatch.txt

          cp build/flat-evidence.axmcaps build/flat-mismatched-identity.axmcaps
          sed -i 's/^renderer axm.contract.flat-demo$/renderer axm.contract.flat-demo-mismatch/' \
            build/flat-mismatched-identity.axmcaps
          set +e
          ./build/axm-render-external \
            --renderer ./build/contract_flat_renderer \
            --request build/contract-flat-reference.axmrender \
            --receipt build/mismatched-flat.axmreceipt \
            --capabilities build/mismatched-flat-fresh.axmcaps \
            --expect-capabilities build/flat-mismatched-identity.axmcaps \
            > build/mismatched-flat-dispatch.txt 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'fresh capability manifest does not match expected manifest: renderer mismatch' \
            build/mismatched-flat-dispatch.txt
          test ! -e build/mismatched-flat.axmreceipt
      - name: Render native evidence frame and receipt
        run: ./build/axm-render --request build/reference.axmrender --receipt build/frame.axmreceipt
      - name: Record native output and receipt evidence
        run: |
          sha256sum build/request-frame.ppm
          cat build/frame.axmreceipt
          grep -q '^frame_pixels_digest64 0x456f404dd94c91da$' build/frame.axmreceipt
      - name: Render contract-only flat body evidence
        run: ./build/contract_flat_renderer build/contract-flat.axmrender build/contract-flat.axmreceipt
      - name: Record contract-only flat body evidence
        run: |
          sha256sum build/contract-flat.ppm
          cat build/contract-flat.axmreceipt
          grep -q '^frame_pixels_digest64 0x5c48decbca7cb29f$' build/contract-flat.axmreceipt
      - name: Render same-intent flat comparison frame
        run: ./build/contract_flat_renderer build/contract-flat-reference.axmrender build/contract-flat-reference.axmreceipt
      - name: Compare cross-backend receipt evidence
        run: |
          sha256sum build/contract-flat-reference.ppm
          cat build/contract-flat-reference.axmreceipt
          grep -q '^frame_pixels_digest64 0x5338e2b2729f1381$' build/contract-flat-reference.axmreceipt
          ./build/axm-render-compare build/frame.axmreceipt build/contract-flat-reference.axmreceipt
      - name: Replay-verify receipt evidence and declared capabilities
        run: |
          ./build/axm-render-verify-receipt build/reference.axmrender build/frame.axmreceipt build/native-evidence.axmcaps
          ./build/axm-render-verify-receipt build/contract-flat-reference.axmrender build/contract-flat-reference.axmreceipt build/flat-evidence.axmcaps
      - name: Render through real external ImageMagick adapter
        run: |
          export AXM_IMAGEMAGICK_CONVERT="$(command -v convert)"
          convert -version
          ./build/axm-render-external \
            --renderer ./build/imagemagick_svg_renderer \
            --request build/imagemagick-reference.axmrender \
            --receipt build/imagemagick-evidence.axmreceipt \
            --capabilities build/imagemagick-evidence.axmcaps
          cat build/imagemagick-evidence.axmcaps
          cat build/imagemagick-evidence.axmreceipt
          sha256sum build/imagemagick-reference.ppm
          ./build/axm-render-compare build/frame.axmreceipt build/imagemagick-evidence.axmreceipt | tee build/imagemagick-compare.txt
          grep -q '^comparable_v1=YES$' build/imagemagick-compare.txt

          ./build/imagemagick_svg_renderer --capabilities build/imagemagick-identity-check.axmcaps \
            | tee build/imagemagick-identity.txt
          delegated_digest="$(sed -n 's/^delegated_executable_digest64=0x//p' build/imagemagick-identity.txt)"
          test "${#delegated_digest}" -eq 16
          grep -q "^renderer_version 0.2.0+delegated-fnv64-${delegated_digest}$" build/imagemagick-identity-check.axmcaps
          grep -q "^renderer_version 0.2.0+delegated-fnv64-${delegated_digest}$" build/imagemagick-evidence.axmcaps
          grep -q "^renderer_version 0.2.0+delegated-fnv64-${delegated_digest}$" build/imagemagick-evidence.axmreceipt
