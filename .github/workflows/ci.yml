name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Render evidence frame and receipt
        run: ./build/axm-render --request build/reference.axmrender --receipt build/frame.axmreceipt
      - name: Record output and receipt evidence
        run: |
          sha256sum build/request-frame.ppm
          cat build/frame.axmreceipt
